name: Update Forecast & Observations

on:
  push:
    branches: [main]
    paths: [.github/workflows/update_forecast.yml]
  schedule:
    # Run every 30 minutes for Netatmo observations
    - cron: '17,47 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Netatmo observations
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: python fetch_observations.py
        continue-on-error: true  # Don't fail if Netatmo is down

      - name: Check if forecast should run
        id: check_forecast
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          # Delayed scheduled runs must still refresh an old forecast.
          generated = datetime.fromisoformat(json.loads(Path('docs/forecast.json').read_text())['meta']['generated_at'])
          due = datetime.now(timezone.utc) - generated >= timedelta(hours=2)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_forecast={str(due).lower()}\n")
          PY

      - name: Generate debiased forecast
        if: steps.check_forecast.outputs.run_forecast == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate_forecast.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/forecast.json docs/observations.json docs/forecast_history.json docs/station_history.json
          git diff --staged --quiet || git commit -m "Update forecast & observations $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
